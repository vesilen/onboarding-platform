spring:
  application:
    name: onboarding-api

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness, used later by Azure
  info:
    env:
      enabled: true
info:
  app:
    description: This is the bank onboarding api
