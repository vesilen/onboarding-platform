spring:
  application:
    name: onboarding-api
  cloud:
    azure:
      keyvault:
        secret:
          property-source-enabled: ${KEYVAULT_ENABLED:false}
          property-sources:
            - endpoint: ${AZURE_KEYVAULT_ENDPOINT:}

onboarding:
  kyc:
    api-key: ${kyc-api-key:local-dev-key}   # resolved from Key Vault when enabled

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness, used later by Azure
  info:
    env:
      enabled: true
info:
  app:
    description: This is the bank onboarding api
