spring:
  application:
    name: library-api
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that the entities match it
  flyway:
    locations: classpath:db/migration   # the default, written out so it is easy to find
server:
  port: 8081
outbox:
  relay:
    enabled: true        # false = no scheduled relay (tests call OutboxRelay.publishPending() themselves)
    fixed-delay: 5s      # pause between two relay runs
    batch-size: 50       # max events per run
