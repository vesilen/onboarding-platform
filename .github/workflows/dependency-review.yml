name: Dependency review

# Blocks a PR that adds a dependency with a known vulnerability or a disallowed licence.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # post a summary comment on the PR

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
